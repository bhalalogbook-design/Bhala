<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bhala</title>
<meta name="description" content="Bhala: the daily logbook for South African artisan apprentices. Log your day in 2 minutes, match your codes, print your logbook.">
<meta name="theme-color" content="#0E2A47">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bhala">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one phone-width app column; navy header band, white cards on a cool grey ground, safety-orange actions, fixed bottom bar */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EEF1F5; --line:#E0E5EB; --line-strong:#C3CCD6;
  --fg:#14202E; --muted:#4A5868; --brand:#0E2A47; --on-brand:#FFFFFF; --on-brand-muted:#C8D3DF; --brand-chip:#1D3D60;
  --accent:#F26B1D; --on-accent:#0E2A47; --accent-soft:#FDEBDF; --accent-tint:#FFF6F0; --accent-text:#B4490A;
  --chip:#E8EDF3; --ok-bg:#E3F3EA; --ok-fg:#1B6B3E; --warn-bg:#FDEBDF; --warn-fg:#8A3707;
  --danger:#B42318; --danger-bg:#FDECEA; --focus:#2E6BD8; --thumb:#DCE3EB; --toast-bg:#14202E; --toast-fg:#FFFFFF;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Space Grotesk','Inter',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1521; --surface:#132131; --surface-2:#192A3C; --line:#243649; --line-strong:#3A4F66;
  --fg:#E9EEF4; --muted:#A5B3C2; --brand:#0F2C4B; --on-brand:#FFFFFF; --on-brand-muted:#B9C7D6; --brand-chip:#1F4369;
  --accent:#F47A30; --on-accent:#0B1521; --accent-soft:#3B2618; --accent-tint:#2A1D14; --accent-text:#FF9C5E;
  --chip:#22354A; --ok-bg:#12392A; --ok-fg:#86D9A8; --warn-bg:#3E2715; --warn-fg:#FFB580;
  --danger:#FF8A80; --danger-bg:#3D1C1A; --focus:#7AA7FF; --thumb:#22354A; --toast-bg:#E9EEF4; --toast-fg:#0B1521;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0B1521; --surface:#132131; --surface-2:#192A3C; --line:#243649; --line-strong:#3A4F66;
  --fg:#E9EEF4; --muted:#A5B3C2; --brand:#0F2C4B; --on-brand:#FFFFFF; --on-brand-muted:#B9C7D6; --brand-chip:#1F4369;
  --accent:#F47A30; --on-accent:#0B1521; --accent-soft:#3B2618; --accent-tint:#2A1D14; --accent-text:#FF9C5E;
  --chip:#22354A; --ok-bg:#12392A; --ok-fg:#86D9A8; --warn-bg:#3E2715; --warn-fg:#FFB580;
  --danger:#FF8A80; --danger-bg:#3D1C1A; --focus:#7AA7FF; --thumb:#22354A; --toast-bg:#E9EEF4; --toast-fg:#0B1521;
  color-scheme:dark; }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,figure{margin:0}
.app{max-width:480px;margin:0 auto;min-height:100%}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack,.stack-xs,.stack-sm,.stack-lg{display:flex;flex-direction:column}
.stack{gap:12px}.stack-xs{gap:4px}.stack-sm{gap:8px}.stack-lg{gap:20px}
.row{display:flex;align-items:center;gap:12px}
.row-top{display:flex;align-items:flex-start;gap:12px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid-site{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:8px}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}.fw4{font-weight:400}.fw5{font-weight:500}.fw6{font-weight:600}
.accent-text{color:var(--accent-text)}
.h1{font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1.2;text-wrap:balance}
.h2{font-size:17px;font-weight:600}
.h3{font-size:16px;font-weight:600}

/* header band */
.hero{background:var(--brand);color:var(--on-brand)}
.hero-in{padding-block:16px 22px;display:flex;flex-direction:column;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-.01em}
.logo-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--brand);display:grid;place-items:center}
.testbadge{font:inherit;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--on-brand-muted);color:var(--on-brand-muted);background:transparent;white-space:nowrap;cursor:pointer}
.price{font-size:15px;color:var(--muted)}.price b{font-family:var(--font-display);font-size:36px;color:var(--fg);margin-right:4px}
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:8px}.ticks li{padding-left:28px;position:relative;font-size:15px}
.ticks li::before{content:'';position:absolute;left:4px;top:4px;width:12px;height:7px;border-left:2.5px solid var(--ok-fg);border-bottom:2.5px solid var(--ok-fg);transform:rotate(-45deg)}
.hero-title{font-family:var(--font-display);font-size:28px;line-height:1.15;font-weight:700;text-wrap:balance}
.hero-sub{color:var(--on-brand-muted);font-size:14px}
.tradechip{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--brand-chip);color:var(--on-brand);font-size:13px;font-weight:600}
.tradechip svg{color:var(--accent)}
.hero .meter{background:rgba(255,255,255,.18);height:8px;border-radius:4px}

main{display:flex;flex-direction:column;gap:16px;padding-block:16px 24px}
main.has-bar{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}

/* buttons */
.btn{min-height:48px;padding:0 16px;border-radius:12px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;text-align:center;line-height:1.2;cursor:pointer}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-lg{min-height:54px;font-size:16px;border-radius:14px}
.btn-ghost{background:var(--surface);color:var(--fg);border:1.5px solid var(--line-strong);font-weight:600}
.btn-outline{background:var(--surface);color:var(--fg);border:1.5px solid var(--fg);font-weight:600}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1.5px solid var(--danger);font-weight:600}
.btn[disabled]{opacity:.55;cursor:default}
.btn-block{width:100%}
.linkbtn{background:none;border:0;padding:0 2px;min-height:44px;color:var(--accent-text);font-weight:600;font-size:14px;cursor:pointer}
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:transparent;color:var(--fg);display:grid;place-items:center;flex-shrink:0}
.iconbtn-spacer{width:44px;height:44px;flex-shrink:0}
.ico-tile{width:40px;height:40px;flex-shrink:0;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.ico-tile.ok{background:var(--ok-bg);color:var(--ok-fg)}

/* week strip and stats */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{min-height:64px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 0}
.day .dl{font-size:11px;font-weight:600;color:var(--muted)}
.day .dd{font-family:var(--font-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.day .ddot{width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.day.on{background:var(--ok-bg);border-color:var(--ok-bg)}
.day.on .ddot{background:var(--ok-fg)}
.day.today{border-color:var(--accent)}
.day[disabled]{opacity:.45;cursor:default}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left;color:var(--fg)}
.stat b{font-family:var(--font-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.stat b small{font-size:15px;color:var(--muted);font-weight:500}
.stat span{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px;display:block}
.meter i{display:block;height:100%;background:var(--accent);border-radius:inherit}

/* entries */
.entries{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.entry{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;color:var(--fg)}
.entry:last-child{border-bottom:0}
.datebox{width:40px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.dow{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.05em}
.dnum{font-family:var(--font-display);font-size:20px;font-weight:700}
.entry-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.entry-title{font-weight:600;font-size:15px}
.entry-meta{font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--fg);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok-fg)}
.tag.warn{background:var(--warn-bg);color:var(--warn-fg)}
.month{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:4px 4px 0}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500;color:var(--muted);min-width:0}
input[type=text],input[type=email],input[type=date],input[type=time],input[type=search],input[type=number],select,textarea{width:100%;min-height:48px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--fg);font-size:15px;font-weight:400}
input[type=date],input[type=time]{padding:0 8px}
textarea{padding:10px 12px;min-height:88px;resize:vertical;line-height:1.45}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.sr-only:focus-visible + label{outline:3px solid var(--focus);outline-offset:2px}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.searchbox input{padding-left:40px}

/* choice controls */
.opt{width:100%;min-height:58px;padding:8px 12px;display:flex;align-items:center;gap:12px;text-align:left;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
.opt[aria-checked=true]{border-color:var(--accent);background:var(--accent-tint)}
.dot{width:20px;height:20px;flex-shrink:0;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center}
.opt[aria-checked=true] .dot{border-color:var(--accent-text)}
.opt[aria-checked=true] .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent-text)}
.opt-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.opt-title{font-weight:600;font-size:15px}
.opt-sub{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--fg);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-align:left}
.chip[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.chip svg{width:16px;height:16px;flex-shrink:0}
.chip.dashed{border-style:dashed}
.toolgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tool{position:relative;min-height:84px;padding:8px 6px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-size:13px;font-weight:600;line-height:1.2}
.tool .tic{color:var(--muted);display:flex}
.tool[aria-pressed=true]{border-color:var(--accent);background:var(--accent-tint)}
.tool[aria-pressed=true] .tic{color:var(--accent-text)}
.tool .tick{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.tool .tick svg{width:12px;height:12px}
.trades{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.trade{min-height:58px;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg);text-align:left;font-weight:600;font-size:14px;line-height:1.2}
.trade .ti{width:36px;height:36px;border-radius:10px;background:var(--chip);color:var(--fg);display:grid;place-items:center;flex-shrink:0}
.trade[aria-pressed=true]{border-color:var(--accent);background:var(--accent-tint)}
.trade[aria-pressed=true] .ti{background:var(--accent);color:var(--on-accent)}

/* log flow */
.flowtop{background:var(--surface);border-bottom:1px solid var(--line)}
.flowtop-in{padding-block:8px 12px;display:flex;flex-direction:column;gap:8px}
.progress{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:0 4px}
.progress span{height:6px;border-radius:3px;background:var(--line)}
.progress span.on{background:var(--accent)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar-in{max-width:480px;margin:0 auto;padding-top:10px;padding-bottom:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
.nav-in{flex-direction:row;align-items:flex-end;justify-content:space-between;padding-top:6px;padding-bottom:10px}
.nav-it{min-width:58px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:500}
.nav-it[aria-current=page]{color:var(--fg);font-weight:700}
.nav-plus{width:58px;height:58px;margin-bottom:4px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.nav-plus svg{width:26px;height:26px}
.codecard{background:var(--brand);color:var(--on-brand);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.codecard .k{font-size:13px;font-weight:600;color:var(--on-brand-muted)}
.codecard .code{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:.01em;overflow-wrap:anywhere}
.codecard .desc{font-size:14px;color:var(--on-brand-muted)}
.codecard .draft{align-self:flex-start;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--brand-chip);color:var(--on-brand)}
.pips{display:flex;align-items:center;gap:6px}
.pip{width:12px;height:12px;border-radius:50%;border:2px solid var(--on-brand-muted)}
.pip.on{background:var(--accent);border-color:var(--accent)}
.dl{display:flex;flex-direction:column;padding:0 14px;margin:0}
.dl-row{display:flex;align-items:center;gap:10px;min-height:50px;padding-block:6px;border-bottom:1px solid var(--line)}
.dl-row:last-child{border-bottom:0}
.dl-row dt{width:84px;flex-shrink:0;font-size:13px;color:var(--muted)}
.dl-row dd{margin:0;flex:1;min-width:0;font-size:14px;font-weight:600}
.check{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex-shrink:0;margin:0}
.mat-list{list-style:none;margin:0;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.mat{display:flex;align-items:center;gap:8px;min-height:62px;border-bottom:1px solid var(--line);padding-block:6px}
.mat:last-child{border-bottom:0}
.mat-name{flex:1;min-width:0;font-weight:600;font-size:14.5px}
.stepper{display:flex;align-items:center;gap:4px;flex-shrink:0}
.stepper button{width:40px;height:44px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--fg);display:grid;place-items:center}
.stepper button.plus{border-color:var(--accent);background:var(--accent-soft)}
.stepper input{width:58px;min-height:44px;text-align:center;padding:0 4px;font-weight:700;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.unit{font-size:12px;color:var(--muted);width:40px;flex-shrink:0;overflow-wrap:anywhere}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thumbs.big{grid-template-columns:repeat(2,minmax(0,1fr))}
.thumb{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--thumb);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-x{position:absolute;top:4px;right:4px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(10,20,32,.72);color:#FFFFFF;display:grid;place-items:center}
.thumb .miss{display:none}
.thumb.missing .miss{display:grid;position:absolute;inset:0;place-items:center;font-size:12px;color:var(--muted);text-align:center;padding:6px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--accent-tint);color:var(--fg);border:1.5px solid var(--accent)}
.banner > svg{flex-shrink:0;margin-top:1px;color:var(--accent-text)}
.banner.warn{background:var(--danger-bg);border-color:var(--danger)}
.banner.warn > svg{color:var(--danger)}
.err{color:var(--danger);font-size:14px;font-weight:600}
.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.copybox{font-size:13px;min-height:150px;font-family:var(--font-body)}

/* codes */
.lvls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lvl{min-height:58px;padding:8px;border-radius:10px;border:0;background:var(--surface-2);color:var(--fg);display:flex;flex-direction:column;justify-content:space-between;gap:6px;text-align:left}
.lvl.done{background:var(--ok-bg);color:var(--ok-fg)}
.lvl-top{display:flex;justify-content:space-between;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.lvl-dots{display:flex;gap:4px}
.lvl-dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.lvl-dots i.on{background:var(--accent);border-color:var(--accent)}
.lvl.done .lvl-dots i{background:var(--ok-fg);border-color:var(--ok-fg)}

/* logbook preview */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.lb{border-collapse:collapse;width:100%;min-width:620px;font-size:12.5px;line-height:1.4}
table.lb th,table.lb td{border:1px solid var(--line-strong);padding:6px 8px;text-align:left;vertical-align:top}
table.lb th{background:var(--chip);font-weight:700}
table.lb td.num{text-align:right;font-variant-numeric:tabular-nums}
table.lb tfoot td{font-weight:700;background:var(--surface-2)}
table.lb td.code{font-weight:600;white-space:nowrap}

/* ---------- small helpers ---------- */
var $app = document.getElementById('app');
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function pad(n){ return String(n).padStart(2, '0'); }
function isoDate(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseISO(s){ var p = String(s).split('-').map(Number); return new Date(p[0], (p[1] || 1) - 1, p[2] || 1); }
function todayISO(){ return isoDate(new Date()); }
var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var DOWL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtShort(s){ var d = parseISO(s); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON3[d.getMonth()]; }
function fmtLong(s){ var d = parseISO(s); return DOWL[d.getDay()] + ', ' + d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtDay(s){ var d = parseISO(s); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); }
function rangeLabel(a, b){
  var x = parseISO(a), y = parseISO(b);
  if (a === b) return fmtDay(a);
  if (x.getFullYear() === y.getFullYear()){
    if (x.getMonth() === y.getMonth()) return x.getDate() + ' to ' + y.getDate() + ' ' + MON[y.getMonth()] + ' ' + y.getFullYear();
    return x.getDate() + ' ' + MON[x.getMonth()] + ' to ' + y.getDate() + ' ' + MON[y.getMonth()] + ' ' + y.getFullYear();
  }
  return fmtDay(a) + ' to ' + fmtDay(b);
}
function mins(t){ var p = String(t || '0:0').split(':').map(Number); return (p[0] || 0) * 60 + (p[1] || 0); }
function hoursOf(e){ return Math.max(0, (mins(e.end) - mins(e.start) - (Number(e.breakMin) || 0)) / 60); }
function fmtH(h){ return String(Math.round(h * 10) / 10); }

/* ---------- storage: IndexedDB on this device, with fallbacks ---------- */
var Store = {
  mode:'memory', db:null, mem:{},
  init:function(){
    var self = this;
    return new Promise(function(res){
      var done = false;
      function fallback(){
        if (done) return; done = true; self.db = null;
        try { localStorage.setItem('lb_probe', '1'); localStorage.removeItem('lb_probe'); self.mode = 'local'; } catch (e){ self.mode = 'memory'; }
        res();
      }
      try {
        if (!window.indexedDB) return fallback();
        var r = indexedDB.open('bhala', 1);
        r.onupgradeneeded = function(){ var d = r.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos'); };
        r.onsuccess = function(){ if (done) return; done = true; self.db = r.result; self.mode = 'idb'; res(); };
        r.onerror = fallback; r.onblocked = fallback;
        setTimeout(fallback, 4000);
      } catch (e){ fallback(); }
    });
  },
  req:function(r){ return new Promise(function(res, rej){ r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }); },
  os:function(name, mode){ return this.db.transaction(name, mode).objectStore(name); },
  loadState:function(){
    var self = this;
    if (self.mode === 'idb') return self.req(self.os('kv', 'readonly').get('state')).catch(function(){ return null; });
    if (self.mode === 'local'){ try { var s = localStorage.getItem('lb_state'); return Promise.resolve(s ? JSON.parse(s) : null); } catch (e){ return Promise.resolve(null); } }
    return Promise.resolve(null);
  },
  saveState:function(st){
    var self = this, data;
    try { data = clone(st); } catch (e){ return Promise.resolve(false); }
    if (self.mode === 'idb') return self.req(self.os('kv', 'readwrite').put(data, 'state')).then(function(){ return true; }).catch(function(){ return false; });
    if (self.mode === 'local'){ try { localStorage.setItem('lb_state', JSON.stringify(data)); return Promise.resolve(true); } catch (e){ return Promise.resolve(false); } }
    return Promise.resolve(false);
  },
  putPhoto:function(id, blob){
    this.mem[id] = blob;
    if (this.mode !== 'idb') return Promise.resolve();
    return this.req(this.os('photos', 'readwrite').put(blob, id)).catch(function(){});
  },
  getPhoto:function(id){
    var self = this;
    if (self.mem[id]) return Promise.resolve(self.mem[id]);
    if (self.mode !== 'idb') return Promise.resolve(null);
    return self.req(self.os('photos', 'readonly').get(id)).then(function(b){ if (b) self.mem[id] = b; return b || null; }).catch(function(){ return null; });
  },
  delPhoto:function(id){
    delete this.mem[id];
    if (this.mode !== 'idb') return Promise.resolve();
    return this.req(this.os('photos', 'readwrite').delete(id)).catch(function(){});
  }
};

function validate(step){
  var d = S.draft;
  if (step === 1){
    if (!d.date) return 'Pick the date you did this work.';
    if (d.date > todayISO()) return 'You can’t log a day that hasn’t happened yet.';
    if (!d.editId && !hasSamples() && d.date < earliestLogDate()) return BACK_MSG;
    if (mins(d.end) <= mins(d.start)) return 'Finish time must be after start time.';
    if (!d.area) return 'Pick the area you worked on.';
    if (!d.tasks.length) return 'Tap at least one task you did.';
  }
  if (step === 4 && !d.level) return 'Choose how hands-on you were. It sets the level on your code.';
  return '';
}

var urlCache = {};
function hydratePhotos(){
  var imgs = $app.querySelectorAll('img[data-photo]');
  Array.prototype.forEach.call(imgs, function(img){
    var id = img.getAttribute('data-photo');
    if (urlCache[id]){ img.src = urlCache[id]; return; }
    Store.getPhoto(id).then(function(b){
      if (b){ urlCache[id] = URL.createObjectURL(b); img.src = urlCache[id]; }
      else { var f = img.closest('.thumb'); if (f) f.classList.add('missing'); }
    });
  });
}
function render(){
  if (!UI.ready){
    $app.innerHTML = '<header class="hero"><div class="gut hero-in"><span class="logo">' + logoMark() + 'Bhala</span>' +
      '<div class="stack-xs"><h1 class="hero-title">Opening your logbook</h1><p class="hero-sub">One moment…</p></div></div></header>';
    return;
  }
  var v = VIEWS[UI.view] || vToday;
  $app.innerHTML = v();
  hydratePhotos();
}
function top(){ try { window.scrollTo(0, 0); } catch (e){} }
var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.hidden = true; }, 2800);
}
function toggleIn(arr, v){ var i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); }
function addMat(name, unit){
  var d = S.draft; name = String(name || '').trim(); if (!name) return;
  var ex = d.materials.filter(function(m){ return m.name.toLowerCase() === name.toLowerCase(); })[0];
  if (ex) ex.qty = (Number(ex.qty) || 0) + 1; else d.materials.push({name:name, unit:unit || 'pcs', qty:1});
  UI.matQuery = ''; persist(); render();
  var inp = document.getElementById('qty' + (d.materials.length - 1)); if (inp && !ex) inp.focus();
}
function dropDraftPhotos(d){ (d.photos || []).forEach(function(p){ if (!S.entries.some(function(e){ return (e.photos || []).some(function(x){ return x.id === p.id; }); })) Store.delPhoto(p.id); }); }

/* ---------- photos ---------- */
function processImage(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      try {
        var max = 1280, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
        w = Math.max(1, Math.round(w * s)); h = Math.max(1, Math.round(h * s));
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob(function(b){ URL.revokeObjectURL(url); if (b) res({blob:b, w:w, h:h}); else rej(new Error('encode')); }, 'image/jpeg', 0.78);
      } catch (e){ URL.revokeObjectURL(url); rej(e); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('decode')); };
    img.src = url;
  });
}
function addPhotos(files){
  var d = S.draft; if (!d || !files || !files.length) return;
  var list = Array.prototype.slice.call(files, 0, 10), bad = 0;
  UI.photoBusy = true; render();
  var chain = Promise.resolve();
  list.forEach(function(f){
    chain = chain.then(function(){
      return processImage(f).then(function(r){
        var id = 'p' + uid();
        return Store.putPhoto(id, r.blob).then(function(){ d.photos.push({id:id, w:r.w, h:r.h}); });
      }).catch(function(){ bad++; });
    });
  });
  chain.then(function(){
    UI.photoBusy = false; persist(); render();
    if (bad) toast(bad === 1 ? 'One file couldn’t be added. Use a JPG or PNG photo.' : bad + ' files couldn’t be added. Use JPG or PNG photos.');
  });
}

/* ---------- backup and restore ---------- */
function blobToDataURL(b){ return new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; r.readAsDataURL(b); }); }
function dataURLToBlob(u){
  var parts = String(u).split(','), mime = ((parts[0] || '').match(/data:([^;]+)/) || [])[1] || 'image/jpeg';
  var bin = atob(parts[1] || ''), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}
function cleanEntry(e){
  if (!e || typeof e !== 'object' || typeof e.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(e.date)) return null;
  var tid = TRADES[e.trade] ? e.trade : 'electrician';
  if (!modOf(tid, e.area) || !lvlOf(e.level)) return null;
  function arr(a){ return Array.isArray(a) ? a.filter(function(x){ return typeof x === 'string'; }).map(function(x){ return x.slice(0, 120); }) : []; }
  return {id:String(e.id || uid()), trade:tid, date:e.date, start:/^\d{2}:\d{2}$/.test(e.start) ? e.start : '07:30', end:/^\d{2}:\d{2}$/.test(e.end) ? e.end : '16:00',
    breakMin:Number(e.breakMin) || 0, site:String(e.site || '').slice(0, 200), area:e.area, level:e.level, tasks:arr(e.tasks), tools:arr(e.tools), ppe:arr(e.ppe),
    materials:Array.isArray(e.materials) ? e.materials.filter(function(m){ return m && typeof m.name === 'string'; }).map(function(m){ return {name:m.name.slice(0, 120), unit:String(m.unit || 'pcs').slice(0, 12), qty:Number(m.qty) || 0}; }) : [],
    photos:Array.isArray(e.photos) ? e.photos.filter(function(p){ return p && typeof p.id === 'string'; }).map(function(p){ return {id:p.id, w:Number(p.w) || 4, h:Number(p.h) || 3}; }) : [],
    notes:String(e.notes || '').slice(0, 2000), status:['signed', 'waiting', 'notsent'].indexOf(e.status) >= 0 ? e.status : 'notsent',
    sample:!!e.sample, createdAt:Number(e.createdAt) || Date.now(), updatedAt:Number(e.updatedAt) || Date.now()};
}
function cleanProfile(pr){
  pr = pr || {};
  return {name:String(pr.name || '').slice(0, 120), studentNo:String(pr.studentNo || '').slice(0, 60), employer:String(pr.employer || '').slice(0, 160),
    mentor:String(pr.mentor || '').slice(0, 120), college:String(pr.college || COLLEGE).slice(0, 160), trade:TRADES[pr.trade] ? pr.trade : 'electrician'};
}
function backup(){
  (function(){
    var out = {app:'Bhala', v:2, exportedAt:new Date().toISOString(), profile:S.profile, entries:S.entries, photos:{},
      plan:{uid:S.plan.uid, trialStart:S.plan.trialStart, email:S.plan.email || ''}};
    var chain = Promise.resolve();
    S.entries.forEach(function(e){ (e.photos || []).forEach(function(p){
      chain = chain.then(function(){ return Store.getPhoto(p.id).then(function(b){ if (b) return blobToDataURL(b).then(function(u){ out.photos[p.id] = u; }); }); });
    }); });
    chain.then(function(){
      return saveFile('Bhala backup ' + todayISO() + '.json', new Blob([JSON.stringify(out)], {type:'application/json'}));
    }).then(function(){ toast('Backup ready. Keep it somewhere safe, like Google Drive or email.'); }).catch(function(err){
      toast(err && err.code === 'declined' ? 'Backup cancelled' : 'The backup couldn’t be saved here.');
    });
  })();
}
function readRestore(file){
  if (!file) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var o = JSON.parse(r.result);
      if (!o || o.app !== 'Bhala' || !Array.isArray(o.entries)) throw new Error('bad');
      UI.pendingRestore = o; render();
    } catch (e){ toast('That file isn’t a Bhala backup.'); }
  };
  r.onerror = function(){ toast('That file couldn’t be read.'); };
  r.readAsText(file);
}

/* ---------- PDF logbook (pdf-lib, loaded from cdnjs below) ---------- */
function waitPdfLib(){
  var t0 = Date.now();
  return new Promise(function(res, rej){
    (function poll(){
      if (window.PDFLib && window.PDFLib.PDFDocument) return res(window.PDFLib);
      if (Date.now() - t0 > 20000) return rej(new Error('pdf-lib'));
      setTimeout(poll, 200);
    })();
  });
}
function pdfSafe(s){
  return String(s == null ? '' : s).replace(/[–—]/g, '-').replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
    .replace(/…/g, '...').replace(/[\r\n\t]+/g, ' ').replace(/[^\x20-\x7E\xA0-\xFF]/g, '');
}
function buildPdf(list, withPhotos, tid){
  return waitPdfLib().then(function(L){
    var PDFDocument = L.PDFDocument, rgb = L.rgb, SF = L.StandardFonts, T = tr(tid);
    var W = 595.28, H = 841.89, M = 40;
    var NAVY = rgb(14/255, 42/255, 71/255), ORANGE = rgb(242/255, 107/255, 29/255), INK = rgb(17/255, 24/255, 32/255),
        MUTED = rgb(61/255, 74/255, 88/255), RULE = rgb(154/255, 165/255, 177/255), CHIP = rgb(232/255, 237/255, 243/255),
        PALE = rgb(244/255, 246/255, 248/255), WHITE = rgb(1, 1, 1), BAND_SUB = rgb(200/255, 211/255, 223/255), OK = rgb(27/255, 107/255, 62/255);

      return Promise.all([doc.embedFont(SF.Helvetica), doc.embedFont(SF.HelveticaBold)]);
    }).then(function(fonts){

      function text(t, x, ty, size, f, color){ page.drawText(pdfSafe(t), {x:x, y:H - ty, size:size, font:f || font, color:color || INK}); }
      function textR(t, xr, ty, size, f, color){ var s = pdfSafe(t), ff = f || font; page.drawText(s, {x:xr - ff.widthOfTextAtSize(s, size), y:H - ty, size:size, font:ff, color:color || INK}); }

      }
      function band(){
        page.drawRectangle({x:0, y:H - 58, width:W, height:58, color:NAVY});
        page.drawSvgPath('M5 0H19A5 5 0 0 1 24 5V19A5 5 0 0 1 19 24H5A5 5 0 0 1 0 19V5A5 5 0 0 1 5 0Z', {x:M, y:H - 17, color:ORANGE});
        page.drawSvgPath('M12 20h9', {x:M + 4.5, y:H - 21.5, scale:0.625, borderColor:NAVY, borderWidth:2.4});
        page.drawSvgPath('M16.4 3.6a2.1 2.1 0 0 1 3 3L7.4 18.6a2 2 0 0 1-.9.5l-2.9.8a.5.5 0 0 1-.6-.6l.8-2.9a2 2 0 0 1 .5-.9z', {x:M + 4.5, y:H - 21.5, scale:0.625, borderColor:NAVY, borderWidth:2.4});

      function table(cols, head, rows, foot, opts){

        function drawRow(cells, f, fill, color, cs){

            lines[i].forEach(function(ln, k){
              var ty = y + padY + size + k * lh - 1.5;

              if (c.align === 'right') textR(ln, x + c.w - padX, ty, size, f, cc);

      });
      y = 146 + 3 * 40 + 8;
      text(plural(st.days, 'day', 'days') + ' logged · ' + fmtH(st.hrs) + ' hours · ' + plural(st.photos, 'photo', 'photos') + ' · ' + st.done + ' of ' + st.total + ' codes with 3 or more entries', M, y, 10);
      if (!T.verified){ y += 14; text('Codes for this trade are a draft list. The training provider confirms the final codes.', M, y, 9, font, MUTED); }

      var rows15 = [];
      T.mods.forEach(function(m){ LEVELS.forEach(function(l){ var c = codeStat(st, tid, m.id + '-' + l.id); rows15.push([m.id + '-' + l.id, m.name, l.short, String(c.n), String(c.signed)]); }); });

        ['Code', 'Work experience module', 'Level', 'Entries', 'Signed'], rows15, null,
        {cellColor:function(cells, i){ return (i === 3 && Number(cells[3]) >= 3) ? OK : null; }});

      /* one page per week */
      weeksOf(list).forEach(function(wk){
        newPage();
        text(weekLabel(wk.es), M, 100, 15, bold);
        text((p.name || 'Apprentice') + (p.studentNo ? ' · ' + p.studentNo : '') + ' · ' + T.name + ' · Host employer: ' + (p.employer || '-'), M, 116, 9, font, MUTED);
        y = 128;
        var tot = wk.es.reduce(function(a, e){ return a + hoursOf(e); }, 0), cwW = W - 2 * M;

          wk.es.map(function(e){ return [fmtShort(e.date), workText(e) + (e.site && e.site !== p.employer ? ' Site: ' + e.site + '.' : ''), (e.tools || []).join(', ') || '-', codeOf(e), fmtH(hoursOf(e)), e.status === 'signed' ? 'Signed' : '']; }),

}
function exportPdf(){
  var list = rangeEntries(), tid = curTid();
  if (!list.length){ UI.exp.msg = 'No entries in these dates.'; render(); return; }
  UI.exp.busy = true; UI.exp.msg = ''; render();
  var name = 'Bhala ' + tr(tid).name + ' logbook ' + (String(S.profile.name || 'apprentice').replace(/[^\w\- ]+/g, '').trim() || 'apprentice') + ' ' + list[0].date + ' to ' + list[list.length - 1].date + '.pdf';
  buildPdf(list, UI.exp.photos, tid).then(function(bytes){
    return saveFile(name, new Blob([bytes], {type:'application/pdf'})).then(function(){ UI.exp.msg = 'Your PDF is ready. Find it in your Downloads.'; })
      .catch(function(err){
        var c = err && err.code;
        UI.exp.msg = c === 'declined' ? 'Download cancelled.' : c === 'rate_limited' ? 'A download is already waiting for you. Finish that one first.' : 'The PDF couldn’t be saved here.';
      });
  }).catch(function(err){
    UI.exp.msg = (err && err.message === 'pdf-lib') ? 'The PDF maker didn’t load. Check your internet connection and try again.' : 'Something went wrong making the PDF. Try again.';
    if (window.console) console.error(err);
  }).then(function(){ UI.exp.busy = false; if (UI.view === 'logbook') render(); });
}

/* ---------- actions ---------- */
function go(view){ UI.view = view; UI.err = ''; UI.confirmDel = false; UI.copyText = ''; if (view === 'logbook') initExport(); render(); top(); }
function beginLog(from, date){ S.draft = newDraft(from, date); UI.err = ''; UI.matQuery = ''; UI.view = 'log'; persist(); render(); top(); }
var A = {
  go:function(ds){ go(ds.view); },
  startLog:function(ds){
    if (gate()) return;
    var tid = curTid(), srcs = sorted().filter(function(e){ return tidOf(e) === tid; });
    if (S.draft && !S.draft.editId) dropDraftPhotos(S.draft);
    beginLog(ds.copy === '1' ? srcs[0] : null);
  },
  dayTap:function(ds){
    var hits = sorted().filter(function(e){ return e.date === ds.date; });
    if (hits.length){ A.openEntry({id:hits[0].id}); return; }
    if (ds.date > todayISO()) return;
    if (!hasSamples() && ds.date < earliestLogDate()){ toast(BACK_MSG); return; }
    if (gate()) return;
    if (S.draft && !S.draft.editId) dropDraftPhotos(S.draft);
    beginLog(null, ds.date);
  },
  continueLog:function(){ UI.view = 'log'; UI.err = ''; render(); top(); },
  discardDraft:function(){ if (S.draft) dropDraftPhotos(S.draft); S.draft = null; persist(); render(); toast('Unfinished log removed'); },
  back:function(){ var d = S.draft; if (d.step > 1){ d.step--; UI.err = ''; persist(); render(); top(); } else A.cancelLog(); },
  cancelLog:function(){
    var d = S.draft;
    if (d && d.editId){ var id = d.editId; var orig = S.entries.filter(function(e){ return e.id === id; })[0];
      (d.photos || []).forEach(function(p){ if (!orig || !(orig.photos || []).some(function(x){ return x.id === p.id; })) Store.delPhoto(p.id); });
      S.draft = null; persist(); UI.view = 'entry'; UI.entryId = id; render(); top(); return; }
    UI.view = 'today'; UI.err = ''; persist(); render(); top(); toast('Saved for later. Finish it from the Today screen.');
  },
  next:function(){
    var d = S.draft, err = validate(d.step);
    if (err){ UI.err = err; render(); var el = $app.querySelector('.err'); if (el && el.scrollIntoView) el.scrollIntoView({block:'center'}); return; }
    UI.err = ''; if (d.step < 5){ d.step++; persist(); render(); top(); }
  },
  step:function(ds){ S.draft.step = Number(ds.step); UI.err = ''; persist(); render(); top(); },
  pickArea:function(ds){ var d = S.draft; if (d.area !== ds.id){ d.area = ds.id; d.tasks = []; } UI.err = ''; persist(); render(); },
  toggleTask:function(ds){ toggleIn(S.draft.tasks, ds.v); UI.err = ''; persist(); render(); },
  addTask:function(){ var i = document.getElementById('addTask'), v = (i && i.value || '').trim().slice(0, 80); if (!v) return; if (S.draft.tasks.indexOf(v) < 0) S.draft.tasks.push(v); UI.err = ''; persist(); render(); },
  toggleTool:function(ds){ toggleIn(S.draft.tools, ds.v); persist(); render(); },
  addTool:function(){ var i = document.getElementById('addTool'), v = (i && i.value || '').trim().slice(0, 60); if (!v) return; if (S.draft.tools.indexOf(v) < 0) S.draft.tools.push(v); persist(); render(); },
  togglePpe:function(ds){ toggleIn(S.draft.ppe, ds.v); persist(); render(); },
  matAdd:function(ds){ addMat(ds.name, ds.unit); },
  matAddCustom:function(){ var u = document.getElementById('matUnit'); addMat(UI.matQuery.slice(0, 80), u ? u.value : 'pcs'); },
  matInc:function(ds){ var m = S.draft.materials[Number(ds.i)]; m.qty = Math.round(((Number(m.qty) || 0) + 1) * 100) / 100; persist(); render(); },
  matDec:function(ds){ var m = S.draft.materials[Number(ds.i)]; m.qty = Math.max(0, Math.round(((Number(m.qty) || 0) - 1) * 100) / 100); persist(); render(); },
  matRemove:function(ds){ S.draft.materials.splice(Number(ds.i), 1); persist(); render(); },
  pickLevel:function(ds){ S.draft.level = ds.id; UI.err = ''; persist(); render(); },
  photoRemove:function(ds){
    var d = S.draft; d.photos = d.photos.filter(function(p){ return p.id !== ds.id; });
    if (!isPhotoUsed(ds.id)) Store.delPhoto(ds.id);
    persist(); render();
  },
  saveEntry:function(){
    var d = S.draft, err = validate(1) || validate(4);
    if (err){ UI.err = err; render(); return; }
    var now = Date.now(), id;
    var base = {trade:d.trade, date:d.date, start:d.start, end:d.end, breakMin:Number(d.breakMin) || 0, site:String(d.site || '').trim(), area:d.area, level:d.level,
      tasks:d.tasks.slice(), tools:d.tools.slice(), ppe:d.ppe.slice(),
      materials:d.materials.filter(function(m){ return Number(m.qty) > 0; }).map(function(m){ return {name:m.name, unit:m.unit, qty:Number(m.qty)}; }),
      photos:d.photos.map(function(p){ return {id:p.id, w:p.w, h:p.h}; }), notes:String(d.notes || '').trim(), status:d.sendMentor ? 'waiting' : 'notsent', updatedAt:now};
    if (d.editId){
      var idx = -1; S.entries.forEach(function(e, i){ if (e.id === d.editId) idx = i; });
      if (idx < 0){ id = uid(); S.entries.push(Object.assign({id:id, createdAt:now, sample:false}, base)); }
      else {
        var old = S.entries[idx], keep = {}; base.photos.forEach(function(p){ keep[p.id] = 1; });
        (old.photos || []).forEach(function(p){ if (!keep[p.id]) Store.delPhoto(p.id); });
        S.entries[idx] = Object.assign({}, old, base); id = old.id;
      }
    } else { id = uid(); S.entries.push(Object.assign({id:id, createdAt:now, sample:false}, base)); }
    var wasEdit = !!d.editId;
    S.draft = null; UI.err = ''; persist();
    UI.view = 'entry'; UI.entryId = id; UI.backTo = wasEdit ? (UI.backTo || 'history') : 'today'; UI.confirmDel = false; UI.copyText = ''; render(); top();
    toast(wasEdit ? 'Changes saved' : 'Saved to your logbook');
  },
  openEntry:function(ds){ if (UI.view !== 'entry') UI.backTo = UI.view; UI.view = 'entry'; UI.entryId = ds.id; UI.confirmDel = false; UI.copyText = ''; render(); top(); },
  editEntry:function(){
    var e = getEntry(); if (!e) return;
    if (S.draft && !S.draft.editId) dropDraftPhotos(S.draft);
    var d = clone(e);
    S.draft = {editId:e.id, trade:tidOf(e), step:5, date:d.date, start:d.start, end:d.end, breakMin:d.breakMin, site:d.site, area:d.area, tasks:d.tasks, tools:d.tools, ppe:d.ppe,
      materials:d.materials, level:d.level, photos:d.photos, notes:d.notes, sendMentor:true};
    UI.view = 'log'; UI.err = ''; UI.matQuery = ''; persist(); render(); top();
  },
  toggleSigned:function(){ var e = getEntry(); if (!e) return; e.status = e.status === 'signed' ? 'waiting' : 'signed'; e.updatedAt = Date.now(); persist(); render(); toast(e.status === 'signed' ? 'Marked as signed' : 'Back to waiting for sign-off'); },
  copySummary:function(){
    var e = getEntry(); if (!e) return;
    var txt = summaryText(e);
    function fallback(){ UI.copyText = txt; render(); var b = document.getElementById('copyBox'); if (b){ b.focus(); b.select(); } }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){ toast('Copied. Paste it into WhatsApp for your mentor.'); }, fallback);
      } else fallback();
    } catch (err){ fallback(); }
  },
  askDelete:function(){ UI.confirmDel = true; render(); },
  cancelDelete:function(){ UI.confirmDel = false; render(); },
  confirmDelete:function(){
    var e = getEntry(); if (!e) return;
    S.entries = S.entries.filter(function(x){ return x.id !== e.id; });
    (e.photos || []).forEach(function(p){ if (!isPhotoUsed(p.id)) Store.delPhoto(p.id); });
    UI.confirmDel = false; persist(); go(UI.backTo === 'today' ? 'today' : 'history'); toast('Entry deleted');
  },
  histFilter:function(ds){ UI.histFilter = ds.f; render(); },
  clearCode:function(){ UI.histCode = null; render(); },
  codeTile:function(ds){ UI.histCode = ds.code; UI.histFilter = 'all'; UI.histQuery = ''; go('history'); },
  exportPdf:function(){ if (gate()) return; exportPdf(); },
  checkPay:function(){ waitForPayment(1); },
  reminder:function(){
    saveFile('Bhala daily reminder.ics', new Blob([reminderIcs(UI.remindAt)], {type:'text/calendar'}))
      .then(function(){ toast('Open the file to add the reminder to your calendar'); }, function(){ toast('The reminder couldn’t be saved here.'); });
  },
  backup:function(){ backup(); },
  removeSamples:function(){ removeSamples(); persist(); render(); toast('Sample entries removed'); },
  startOwn:function(){ UI.setupTrade = curTid(); go('setup'); },
  pickTrade:function(ds){ UI.setupTrade = ds.id; var keep = {}; ['name','studentNo','employer','mentor','college'].forEach(function(k){ var el = document.getElementById('s-' + k); if (el) keep[k] = el.value; }); render();
    Object.keys(keep).forEach(function(k){ var el = document.getElementById('s-' + k); if (el) el.value = keep[k]; }); },
  applyRestore:function(){
    var o = UI.pendingRestore; if (!o) return;
    var chain = Promise.resolve();
    Object.keys(o.photos || {}).forEach(function(id){
      chain = chain.then(function(){ try { return Store.putPhoto(String(id), dataURLToBlob(o.photos[id])); } catch (e){ return null; } });
    });
    chain.then(function(){
      S.profile = cleanProfile(o.profile);
      if (o.plan) { S.plan = cleanPlan(o.plan); checkPro().catch(function(){}); }
      S.entries = o.entries.map(cleanEntry).filter(Boolean); S.draft = null; UI.pendingRestore = null; persist(); render();
      toast('Restored ' + plural(S.entries.length, 'entry', 'entries'));
    });
  },
  cancelRestore:function(){ UI.pendingRestore = null; render(); }
};

/* ---------- events ---------- */
$app.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el || !$app.contains(el) || el.disabled) return;
  var fn = A[el.getAttribute('data-act')];
  if (fn){ e.preventDefault(); fn(el.dataset, el); }
});
$app.addEventListener('keydown', function(e){
  if (e.key !== 'Enter') return;
  var t = e.target, act = t && t.getAttribute && t.getAttribute('data-enter');
  if (act && A[act]){ e.preventDefault(); A[act](t.dataset, t); }
  else if (t && t.id === 'matQuery'){ e.preventDefault(); var first = $app.querySelector('#matSuggest [data-act]'); if (first) first.click(); }
});
function readForm(f){ var out = {}; ['name', 'studentNo', 'employer', 'mentor', 'college'].forEach(function(k){ var el = f.elements[k]; out[k] = el ? String(el.value).trim().slice(0, 160) : ''; }); if (!out.college) out.college = COLLEGE; return out; }
$app.addEventListener('submit', function(e){
  e.preventDefault();
  var f = e.target;
  if (f.id === 'profileForm'){
    var p = readForm(f), sel = f.elements.trade ? f.elements.trade.value : curTid();
    p.trade = TRADES[sel] ? sel : curTid();
    var changed = p.trade !== S.profile.trade;
    S.profile = p; persist(); render(); toast(changed ? 'Details saved. Your trade is now ' + tr(p.trade).name + '.' : 'Details saved');
  }
  if (f.id === 'subForm'){
    var em = String(f.elements.email.value || '').trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ UI.err = 'Add a valid email address. PayFast sends your receipt there.'; render(); var ee = document.getElementById('subEmail'); if (ee) ee.focus(); return; }
    if (!onLiveSite()){ UI.err = 'Subscriptions work on the live Bhala website.'; render(); return; }
    S.plan.email = em; persist();
    location.href = CFG.api + '/subscribe?uid=' + encodeURIComponent(S.plan.uid) + '&email=' + encodeURIComponent(em) + '&name=' + encodeURIComponent((S.profile.name || '').split(/\s+/)[0] || '');
    return;
  }
  if (f.id === 'setupForm'){
    var np = readForm(f);
    np.trade = UI.setupTrade && TRADES[UI.setupTrade] ? UI.setupTrade : curTid();
    if (!np.name){ UI.err = 'Add your name. It goes on every logbook page.'; render(); var n = document.getElementById('s-name'); if (n) n.focus(); return; }
    var fresh = !S.entries.some(function(e){ return !e.sample; });
    removeSamples(); if (S.draft){ dropDraftPhotos(S.draft); S.draft = null; }
    if (fresh && !isPro()) S.plan.trialStart = Date.now();
    S.profile = np; UI.err = ''; persist(); go('today'); toast('Your logbook is ready. Log your first day.');
  }
});
function onField(f, t, type){
  var d = S.draft;
  if (d && (f === 'date' || f === 'start' || f === 'end' || f === 'site' || f === 'breakMin' || f === 'notes')){
    d[f] = f === 'breakMin' ? Number(t.value) : t.value;
    if (f !== 'site' && f !== 'notes'){ var l = document.getElementById('hoursLbl'); if (l) l.textContent = hoursLabel(d); }
    persist(); return;
  }
  if (d && f === 'sendMentor'){ d.sendMentor = t.checked; persist(); return; }
  if (d && f.indexOf('qty:') === 0){ var m = d.materials[Number(f.slice(4))]; if (m){ var v = parseFloat(t.value); m.qty = isFinite(v) && v >= 0 ? v : 0; persist(); } return; }
  if (f === 'matQuery'){ UI.matQuery = t.value; var box = document.getElementById('matSuggest'); if (box) box.innerHTML = matSuggestHtml(); return; }
  if (f === 'histQuery'){ UI.histQuery = t.value; var hl = document.getElementById('histList'); if (hl) hl.innerHTML = histListHtml(); return; }
  if (f === 'expFrom' || f === 'expTo'){ UI.exp[f === 'expFrom' ? 'from' : 'to'] = t.value; var pv = document.getElementById('lbPreview'); if (pv) pv.innerHTML = lbPreviewHtml(); return; }
  if (f === 'expPhotos'){ UI.exp.photos = t.checked; return; }
  if (f === 'remindAt'){ UI.remindAt = t.value; return; }
  if (f === 'sampleTrade' && type === 'change' && TRADES[t.value]){
    if (S.draft && !S.draft.editId && S.draft.trade !== t.value){ dropDraftPhotos(S.draft); S.draft = null; }
    removeSamples(); S.entries = S.entries.concat(makeSamples(t.value)); S.profile.trade = t.value; UI.histCode = null;
    persist(); render(); toast('Showing the ' + lowerFirst(tr(t.value).name) + ' sample');
  }
}
$app.addEventListener('input', function(e){ var t = e.target, f = t.getAttribute && t.getAttribute('data-field'); if (f && f !== 'sampleTrade') onField(f, t, 'input'); });
$app.addEventListener('change', function(e){
  var t = e.target, kind = t.getAttribute && t.getAttribute('data-file');
  if (kind === 'photo'){ addPhotos(t.files); t.value = ''; return; }
  if (kind === 'restore'){ readRestore(t.files && t.files[0]); t.value = ''; return; }
  var f = t.getAttribute && t.getAttribute('data-field');
  if (f && (t.type === 'checkbox' || t.tagName === 'SELECT' || t.type === 'date' || t.type === 'time' || t.type === 'number')) onField(f, t, 'change');
});

/* ---------- boot ---------- */
render();
Store.init().then(function(){ return Store.loadState(); }).then(function(saved){
  if (saved && (saved.v === 1 || saved.v === 2) && Array.isArray(saved.entries)){
    S = {v:2, profile:cleanProfile(saved.profile), entries:saved.entries.map(cleanEntry).filter(Boolean), draft:saved.draft || null, plan:cleanPlan(saved.plan)};
    if (S.draft){
      if (!Array.isArray(S.draft.photos) || !Array.isArray(S.draft.tasks)) S.draft = null;
      else if (!TRADES[S.draft.trade]) S.draft.trade = 'electrician';
    }
    if (saved.v === 1) persist();
  } else {
    S = {v:2, profile:sampleProfile('electrician'), entries:makeSamples('electrician'), draft:null, plan:newPlan()};
    persist();
  }
  UI.ready = true;
  var paid = null;
  try { paid = new URLSearchParams(location.search).get('paid'); } catch (e){}
  if (paid !== null){ try { history.replaceState(null, '', location.pathname); } catch (e){} }
  if (paid === '1'){ UI.view = 'plan'; render(); waitForPayment(10); return; }
  render();
  if (paid === '0') toast('Payment cancelled. Nothing was charged.');
  var stale = !S.plan.pro || Date.now() - (S.plan.pro.checkedAt || 0) > 2 * DAY;
  if (stale && (S.plan.pro || S.plan.email)) checkPro().then(function(){ render(); }).catch(function(){});
});
})();
</script>
<script src="pdf-lib.min.js" defer></script>
<script>if ('serviceWorker' in navigator) addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });</script>
