<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Bhala admin</title>
<style>
:root{--bg:#F3F5F8;--surface:#fff;--fg:#14202E;--muted:#4A5868;--line:#E0E5EB;--accent:#F26B1D;--on-accent:#0E2A47;--ok:#1B6B3E;--bad:#B42318}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1521;--surface:#132131;--fg:#E9EEF4;--muted:#A5B3C2;--line:#243649;--accent:#F47A30;--on-accent:#0B1521;--ok:#86D9A8;--bad:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1521;--surface:#132131;--fg:#E9EEF4;--muted:#A5B3C2;--line:#243649;--accent:#F47A30;--on-accent:#0B1521;--ok:#86D9A8;--bad:#FF8A80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
main{max-width:960px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:24px;margin:0 0 4px}.muted{color:var(--muted)}
form{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
input{flex:1;min-width:200px;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
button{font:inherit;font-weight:700;padding:10px 18px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile b{display:block;font-size:24px}
.split{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 16px}
.split input{flex:0 0 80px;min-width:0}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted)}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.active{color:var(--ok);font-weight:600}.err{color:var(--bad);font-weight:600}
</style>
</head>
<body>
<main>
<h1>Bhala admin</h1>
<p class="muted">Paying apprentices and money in. Only people with the admin key can see this.</p>
<form id="f"><input id="key" type="password" autocomplete="current-password" placeholder="Admin key" aria-label="Admin key"><button>Show</button></form>
<p id="msg" role="status"></p>
<div id="out" hidden>
  <div class="tiles">
    <div class="tile"><span class="muted">Mode</span><b id="mode"></b></div>
    <div class="tile"><span class="muted">Paying now</span><b id="active"></b></div>
    <div class="tile"><span class="muted">Collected (gross)</span><b id="gross"></b></div>
    <div class="tile"><span class="muted">After PayFast fees</span><b id="net"></b></div>
  </div>
  <div class="split"><label for="pct">Your share %</label><input id="pct" type="number" min="0" max="100" value="60"><span class="muted" id="splitTxt"></span></div>
  <div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Paid until</th><th class="num">Payments</th><th class="num">Gross</th><th class="num">Net</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
</main>
<script>
(function(){
  var data = null, $ = function(id){ return document.getElementById(id); };
  var R = function(n){ return 'R' + Number(n || 0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); };
  var day = function(ms){ return ms ? new Date(ms).toLocaleDateString('en-ZA', {day:'numeric', month:'short', year:'numeric'}) : '-'; };
  function cell(text, cls){ var td = document.createElement('td'); td.textContent = text; if (cls) td.className = cls; return td; }
  function split(){
    if (!data) return;
    var p = Math.min(100, Math.max(0, Number($('pct').value) || 0));
    $('splitTxt').textContent = 'You ' + R(data.totalNet * p / 100) + ' · Partner ' + R(data.totalNet * (100 - p) / 100) + ' (of all money after fees so far, before other costs)';
  }
  function show(d){
    data = d; $('out').hidden = false; $('msg').textContent = '';
    $('mode').textContent = d.mode; $('active').textContent = d.active; $('gross').textContent = R(d.totalGross); $('net').textContent = R(d.totalNet);
    var tb = $('rows'); tb.textContent = '';
    d.rows.forEach(function(r){
      var tr = document.createElement('tr');
      tr.appendChild(cell(r.name)); tr.appendChild(cell(r.email)); tr.appendChild(cell(r.status, r.status === 'active' ? 'active' : ''));
      tr.appendChild(cell(day(r.paidUntil))); tr.appendChild(cell(String(r.payments), 'num')); tr.appendChild(cell(R(r.totalGross), 'num')); tr.appendChild(cell(R(r.totalNet), 'num'));
      tb.appendChild(tr);
    });
    if (!d.rows.length){ var tr = document.createElement('tr'), td = cell('No subscribers yet.'); td.colSpan = 7; tr.appendChild(td); tb.appendChild(tr); }
    split();
  }
  function load(key){
    $('msg').textContent = 'Loading…'; $('msg').className = '';
    fetch('/api/admin', {headers:{'x-admin-key':key}, cache:'no-store'}).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(x){ if (!x.ok) throw new Error(x.j.error || 'Could not load'); try { sessionStorage.setItem('lbAdmin', key); } catch (e){} show(x.j); })
      .catch(function(e){ $('msg').textContent = e.message; $('msg').className = 'err'; });
  }
  $('f').addEventListener('submit', function(e){ e.preventDefault(); load($('key').value.trim()); });
  $('pct').addEventListener('input', split);
  try { var k = sessionStorage.getItem('lbAdmin'); if (k){ $('key').value = k; load(k); } } catch (e){}
})();
</script>
</body>
</html>
