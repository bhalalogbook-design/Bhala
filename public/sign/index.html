<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Sign a logbook month · Bhala</title>
<link rel="icon" href="/app/icon-192.png">
<style>
:root{--bg:#F3F5F8;--surface:#fff;--surface-2:#EEF1F5;--line:#E0E5EB;--line-strong:#C3CCD6;--fg:#14202E;--muted:#4A5868;--brand:#0E2A47;--accent:#F26B1D;--on-accent:#0E2A47;--ok-bg:#E3F3EA;--ok-fg:#1B6B3E;--bad:#B42318}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1521;--surface:#132131;--surface-2:#192A3C;--line:#243649;--line-strong:#3A4F66;--fg:#E9EEF4;--muted:#A5B3C2;--brand:#0F2C4B;--accent:#F47A30;--on-accent:#0B1521;--ok-bg:#12392A;--ok-fg:#86D9A8;--bad:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1521;--surface:#132131;--surface-2:#192A3C;--line:#243649;--line-strong:#3A4F66;--fg:#E9EEF4;--muted:#A5B3C2;--brand:#0F2C4B;--accent:#F47A30;--on-accent:#0B1521;--ok-bg:#12392A;--ok-fg:#86D9A8;--bad:#FF8A80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
header{background:var(--brand);color:#fff;padding:18px 16px}
header .in,main{max-width:640px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;color:#0E2A47}
header h1{font-size:22px;margin:12px 0 2px}header p{margin:0;color:#C8D3DF;font-size:14px}
main{padding:16px 16px 48px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
h2{font-size:17px;margin:0}.muted{color:var(--muted)}.sm{font-size:14px}.xs{font-size:12px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin:0}
.facts dt{font-size:12px;color:var(--muted)}.facts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.day{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:2px}
.day:first-of-type{border-top:0;padding-top:0}
.day .top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.code{font-size:12px;font-weight:700;background:var(--surface-2);border-radius:6px;padding:1px 6px;white-space:nowrap}
label.field{display:grid;gap:6px;font-weight:600;font-size:14px}
input[type=text]{width:100%;min-height:48px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--fg);font:inherit}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{width:22px;height:22px;margin-top:1px;flex-shrink:0;accent-color:var(--accent)}
canvas{display:block;width:100%;height:180px;border:1.5px dashed var(--line-strong);border-radius:12px;background:#fff;touch-action:none;cursor:crosshair}
.btn{font:inherit;font-weight:700;min-height:52px;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer;width:100%;font-size:17px}
.btn:disabled{opacity:.6}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;justify-self:start;padding:6px 0}
.err{color:var(--bad);font-weight:600;margin:0}
.ok{background:var(--ok-bg);color:var(--ok-fg);border-color:transparent}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="in">
  <span class="logo"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 0 1 3 3L7.4 18.6a2 2 0 0 1-.9.5l-2.9.8a.5.5 0 0 1-.6-.6l.8-2.9a2 2 0 0 1 .5-.9z"/></svg></span>Bhala</span>
  <h1 id="title">Logbook sign-off</h1>
  <p id="sub">Loading the apprentice’s month…</p>
</div></header>
<main id="main" aria-live="polite">
  <section class="card" id="msgCard"><p id="msg">One moment…</p></section>
</main>
<script>
(function(){
  'use strict';
  var main = document.getElementById('main'), token = '';
  try { token = new URLSearchParams(location.search).get('t') || ''; } catch (e){}
  function el(tag, cls, text){ var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function say(title, text, ok){
    document.getElementById('sub').textContent = '';
    main.innerHTML = '';
    var c = el('section', 'card' + (ok ? ' ok' : '')); c.appendChild(el('h2', null, title)); c.appendChild(el('p', null, text)); main.appendChild(c);
  }
  function fmtDate(ms){ var d = new Date(ms), m = ['January','February','March','April','May','June','July','August','September','October','November','December']; return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear(); }
  if (!/^[a-f0-9]{32}$/.test(token)){ say('This link isn’t complete', 'Open the full link from the apprentice’s WhatsApp message.'); return; }

  fetch('/api/sign?t=' + token, {cache:'no-store'}).then(function(r){
    if (r.status === 404) throw new Error('gone');
    if (!r.ok) throw new Error('http');
    return r.json();
  }).then(function(o){
    var p = o.packet;
    if (o.signed){ say('Already signed', p.monthLabel + ' was signed by ' + o.signed.name + ' on ' + fmtDate(o.signed.at) + '. Thank you.', true); return; }
    show(p);
  }).catch(function(err){
    if (err && err.message === 'gone') say('This link has expired', 'It was cancelled, already used, or is older than 45 days. Ask the apprentice to send a new link from Bhala.');
    else say('Couldn’t load the logbook', 'Check your internet connection and open the link again.');
  });

  function show(p){
    var total = p.days.reduce(function(a, d){ return a + (Number(d.h) || 0); }, 0);
    var who = p.apprentice || 'The apprentice';
    document.getElementById('title').textContent = 'Sign ' + who + '’s logbook';
    document.getElementById('sub').textContent = p.monthLabel + ' · ' + p.days.length + (p.days.length === 1 ? ' day' : ' days') + ' · ' + (Math.round(total * 10) / 10) + ' hours';
    main.innerHTML = '';

    var info = el('section', 'card');
    info.appendChild(el('h2', null, 'Apprentice'));
    var dl = el('dl', 'facts');
    [['Name', p.apprentice], ['Trade', p.trade], ['Host employer', p.employer], ['Training provider', p.college], ['Student number', p.studentNo], ['Month', p.monthLabel]].forEach(function(f){
      if (!f[1]) return; var w = el('div'); w.appendChild(el('dt', null, f[0])); w.appendChild(el('dd', null, f[1])); dl.appendChild(w);
    });
    info.appendChild(dl);
    main.appendChild(info);

    var days = el('section', 'card');
    days.appendChild(el('h2', null, 'The days to sign'));
    days.appendChild(el('p', 'muted sm', p.days.length === 1 ? 'Please check the work below, then sign.' : 'Please check the work below. One signature approves all of it.'));
    p.days.forEach(function(d){
      var r = el('div', 'day'), top = el('div', 'top');
      top.appendChild(el('span', null, d.label + ' · ' + d.h + ' h'));
      top.appendChild(el('span', 'code', d.code));
      r.appendChild(top);
      r.appendChild(el('span', 'sm', d.work));
      r.appendChild(el('span', 'muted xs', d.time + (d.level ? ' · ' + d.level : '')));
      days.appendChild(r);
    });
    main.appendChild(days);

    var form = el('section', 'card');
    form.appendChild(el('h2', null, 'Mentor sign-off'));
    var lab = el('label', 'field', 'Your full name'), name = el('input'); name.type = 'text'; name.autocomplete = 'name'; name.value = p.mentor || ''; lab.appendChild(name); form.appendChild(lab);
    var chk = el('label', 'check'), box = el('input'); box.type = 'checkbox'; chk.appendChild(box);
    chk.appendChild(el('span', null, 'I confirm ' + who + ' did this work under my supervision.')); form.appendChild(chk);
    form.appendChild(el('span', 'sm', 'Sign with your finger'));
    var pad = el('canvas'); pad.setAttribute('aria-label', 'Signature pad'); form.appendChild(pad);
    var clear = el('button', 'link', 'Clear signature'); clear.type = 'button'; form.appendChild(clear);
    var err = el('p', 'err'); err.hidden = true; err.setAttribute('role', 'alert'); form.appendChild(err);
    var label = p.days.length === 1 ? 'Approve this day' : 'Approve all ' + p.days.length + ' days';
    var go = el('button', 'btn', label); go.type = 'button'; form.appendChild(go);
    form.appendChild(el('p', 'muted xs', 'Your name and signature go to the apprentice’s Bhala logbook and the monthly sign-off sheet for the training provider.'));
    main.appendChild(form);

    var dpr = Math.min(window.devicePixelRatio || 1, 2), ctx, has = false, down = false, last = null;
    function sizePad(){ var r = pad.getBoundingClientRect(); pad.width = Math.round(r.width * dpr); pad.height = Math.round(r.height * dpr); ctx = pad.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0E2A47'; ctx.fillStyle = '#0E2A47'; has = false; }
    sizePad();
    function pt(ev){ var b = pad.getBoundingClientRect(); return {x:ev.clientX - b.left, y:ev.clientY - b.top}; }
    pad.addEventListener('pointerdown', function(ev){ down = true; last = pt(ev); try { pad.setPointerCapture(ev.pointerId); } catch (e){} ctx.beginPath(); ctx.arc(last.x, last.y, 1.2, 0, Math.PI * 2); ctx.fill(); has = true; ev.preventDefault(); });
    pad.addEventListener('pointermove', function(ev){ if (!down) return; var q = pt(ev); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(q.x, q.y); ctx.stroke(); last = q; has = true; ev.preventDefault(); });
    pad.addEventListener('pointerup', function(){ down = false; });
    pad.addEventListener('pointercancel', function(){ down = false; });
    clear.addEventListener('click', function(){ ctx.clearRect(0, 0, pad.width, pad.height); has = false; });

    go.addEventListener('click', function(){
      var n = name.value.trim(), msg = '';
      if (!n) msg = 'Add your full name.'; else if (!box.checked) msg = 'Tick the box to confirm the work.'; else if (!has) msg = 'Sign in the box with your finger.';
      if (msg){ err.textContent = msg; err.hidden = false; return; }
      err.hidden = true; go.disabled = true; go.textContent = 'Signing…';
      var k = Math.min(1, 600 / pad.width), o = document.createElement('canvas');
      o.width = Math.max(1, Math.round(pad.width * k)); o.height = Math.max(1, Math.round(pad.height * k)); o.getContext('2d').drawImage(pad, 0, 0, o.width, o.height);
      fetch('/api/sign', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'sign', t:token, name:n, agree:true, png:o.toDataURL('image/png')})})
        .then(function(r){ return r.json().then(function(b){ return {s:r.status, b:b}; }); })
        .then(function(res){
          if (res.s === 200) say('Signed. Thank you', who + '’s logbook for ' + p.monthLabel + ' is signed. Bhala picks up your signature by itself. You can close this page.', true);
          else if (res.s === 409) say('Already signed', p.monthLabel + ' was already signed. Thank you.', true);
          else if (res.s === 404) say('This link has expired', 'Ask the apprentice to send a new link from Bhala.');
          else throw new Error('sign');
        }).catch(function(){ go.disabled = false; go.textContent = label; err.textContent = 'That didn’t go through. Check your internet and try again.'; err.hidden = false; });
    });
  }
})();
</script>
</body>
</html>
